<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <style>
      @keyframes glow {
        0%, 100% { filter: drop-shadow(0 0 2px #00FFD1) drop-shadow(0 0 4px #00FFD1); }
        50% { filter: drop-shadow(0 0 4px #00FFD1) drop-shadow(0 0 8px #00FFD1); }
      }
      .neon-text {
        animation: glow 2s infinite;
        font-family: 'Courier New', monospace;
        font-weight: bold;
        font-size: 70px;
        fill: #00FFD1;
        text-anchor: middle;
        dominant-baseline: middle;
      }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" fill="#0A0E21"/>
  
  <!-- Border -->
  <rect x="2" y="2" width="96" height="96" fill="none" stroke="#00FFD1" stroke-width="2" opacity="0.5"/>
  
  <!-- Center circle glow -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#00FFD1" stroke-width="1" opacity="0.3"/>
  
  <!-- LL Text -->
  <text x="50" y="52" class="neon-text">LL</text>
</svg>
